# 集团或品牌的口语叫法 -> 人们说这个叫法时通常指的那一家境内主体（primary，写全称）。
# 导入时用 QCC 核对全称并取信用代码，名字对不上的会被跳过并报出来。每个叫法只指向 primary 一家；
# also 是旗下其他常被查的主体，只作备注，不进别名（要查它们就说全称）。
# 选哪家是判断不是事实，由人复核；标「待复核」的是拿不准的。
- aliases: [腾讯, 腾讯公司]
  primary: 深圳市腾讯计算机系统有限公司
  also: [腾讯科技（深圳）有限公司]
