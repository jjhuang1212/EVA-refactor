# 评测运行中盯费用和取消的间隔（秒）。案例设了 max_cost_cny 时，每隔这么久查一次已结算金额，超了就让这一次在步骤边界停下。
# 间隔越短越及时、查库越频繁；停在步骤边界，实际花费可能略超上限。
cost_poll_seconds: 3

# 模型扮演用户时，一次运行里最多替用户回答几次。agent 问个不停时到这里就停下，这次运行判不通过。
max_sim_rounds: 6

# 模型扮演用户的默认提示词。评测页开跑时可以只对这一批改写；案例里的「补充信息」会接在它后面。
user_sim_prompt: |
  你在扮演一个真实的用户，正在和一个尽调助手对话。你会收到你自己最初发的消息，以及助手之后向你提的问题。
  - 只回答助手问的事，像真人一样简短口语，不要客套，不要一次交代没被问到的信息。
  - 只能依据下面给出的补充信息回答。信息里没有的，就说不清楚或不知道，不要编造。
  - 助手问的是选项时，直接回答选哪一个或写出你的意思。
  - 只输出你要发给助手的话，不要解释你在扮演。
