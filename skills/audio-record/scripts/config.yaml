# 录音记录的配置。改这里，不改代码。

# 是否另外输出一份修改清单（md，逐处对照原文和改后，含被闸门拒绝的）。它不进 PDF，只用来测试和溯源。
# 正式使用时关掉。
emit_change_list: true

# 场景：决定最终 PDF 的名称（也是报告标题）、封面标题上方的英文眉题 eyebrow、封面上有哪些信息项、保密声明。
# 键是场景名，模型按录音内容或用户说法选一个。
# people（可选）列出的信息项不放在封面的标签行，改成封面下方的“角色 / 人员”表，一项一行，项多了也不挤；它们也要写进 fields。
# fields 是向用户问的建议项和封面上的排序；用户给的其他信息项也照样写进封面，排在这些之后；没给的项不写。要加新场景在这里加一段。
scenarios:
  访谈:
    record: 访谈记录
    eyebrow: INTERVIEW TRANSCRIPT
    fields: [访谈日期, 访谈类型, 访谈人员, 受访人员]
    people: [访谈人员, 受访人员]
    notice: 本文件包含保密信息。仅限指定收件人阅读，未经书面许可不得复制、转发或引用。本文件内容为访谈记录，不构成法律意见或审计意见。
  会议:
    record: 会议记录
    eyebrow: MEETING MINUTES
    fields: [会议时间, 会议主题, 参会人员]
    notice: 本文件包含保密信息。仅限指定收件人阅读，未经书面许可不得复制、转发或引用。
  其他录音:
    record: 录音记录
    eyebrow: AUDIO TRANSCRIPT
    fields: [录音日期, 参与人员]
    notice: 本文件包含保密信息。仅限指定收件人阅读，未经书面许可不得复制、转发或引用。
