# 转写纠错的闸门阈值（eva_asr/diff_gate.py、eva_asr/proofread.py）。

# 整理（tidy）：一个块里删掉的字数占该块原文的比例不得超过这个值，防止整块被掏空
max_delete_ratio: 0.5

# 校订一个块（或合并后的块）：改后的字数占改前的比例必须在 [min_keep, max_grow] 之间，只对 10 个字以上的块检查。
# 这里只拦明显离谱的（整块被清空成几个字、成倍膨胀）；丢了哪些事实、加了哪些原话没有的事实，由 proofread 工具里的核对判断，字数量不出来。
min_keep: 0.3
max_grow: 1.15
